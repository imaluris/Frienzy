name: APK Android (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa le dipendenze
        run: npm ci

      # Ricrea il file di Firebase dal secret. Se il secret manca si compila lo stesso, senza notifiche.
      - name: Ricrea google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json creato"
          else
            echo "Secret GOOGLE_SERVICES_JSON assente: compilo senza notifiche"
          fi

      # Configurazione web di Firebase: non è una password (è inclusa in ogni app pubblicata),
      # i dati sono protetti dalle regole di sicurezza di Firestore.
      - name: Build web
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBXOejOTR2RPYugw-a7C7yj7I3D7MdAjkc
          VITE_FIREBASE_AUTH_DOMAIN: frienzy-57ace.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: frienzy-57ace
          VITE_FIREBASE_STORAGE_BUCKET: frienzy-57ace.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "870807149383"
          VITE_FIREBASE_APP_ID: 1:870807149383:web:77031ff79f92f69c850a62
        run: npm run build

      - name: Sincronizza Capacitor
        run: npx cap sync android

      - name: Compila l'APK di debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: frienzy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
